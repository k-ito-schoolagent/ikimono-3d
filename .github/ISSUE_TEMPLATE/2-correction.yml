name: 説明・モデルの修正提案
description: 説明が不正確、前提が書かれていない、数値がちがう、など
title: "[修正] "
labels: ["説明・モデル"]
body:
  - type: input
    id: page
    attributes:
      label: デモ
      placeholder: 例）心臓と血液循環の「肺循環と体循環」
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: どこが、どうちがうか
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 根拠（教科書・論文・計算など）
